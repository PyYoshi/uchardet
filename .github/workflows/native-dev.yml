# SPDX-License-Identifier: MIT
name: Native (dev)

on:
  push:
    branches: [dev]
    paths-ignore: ['**.md', '**.rst']
  pull_request:
    branches: [dev]
    paths-ignore: ['**.md', '**.rst']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.compiler }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, compiler: GCC, cc: gcc, cxx: g++, preset: release}
          - {os: ubuntu-24.04, compiler: GCC, cc: gcc, cxx: g++, preset: debug}
          - {os: ubuntu-24.04, compiler: Clang, cc: clang, cxx: clang++, preset: sanitize}
          - {os: ubuntu-24.04, compiler: GCC, cc: gcc, cxx: g++, preset: cxx20}
          - {os: macos-14, compiler: AppleClang, cc: clang, cxx: clang++, preset: release}
          - {os: macos-14, compiler: AppleClang, cc: clang, cxx: clang++, preset: cxx20}
          - {os: windows-2022, compiler: MSVC, cc: cl, cxx: cl, preset: release}
          - {os: windows-2022, compiler: MSVC, cc: cl, cxx: cl, preset: cxx20}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v7
      - name: Initialize MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'MSVC installation not found' }
          cmd /c "`"$installation\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append }
          }
          if ($LASTEXITCODE -ne 0) { throw 'MSVC environment setup failed' }
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --timeout 30
      - name: Record C++20 library availability
        if: matrix.preset == 'cxx20'
        run: ctest --preset cxx20 -R '^cxx20-library-features$' -V
      - name: Install smoke test
        run: cmake --install build/${{ matrix.preset }} --prefix build/install
      - name: Configure shared-library lifecycle test
        if: matrix.preset == 'release'
        run: cmake -S . -B build/shared-lifecycle -DBUILD_SHARED_LIBS=ON -DBUILD_BINARY=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build shared-library lifecycle test
        if: matrix.preset == 'release'
        run: cmake --build build/shared-lifecycle --config Release --target uchardet-lifecycle --parallel 2
      - name: Test shared-library lifecycle
        if: matrix.preset == 'release'
        run: ctest --test-dir build/shared-lifecycle -C Release -R '^native-lifecycle$' --output-on-failure --no-tests=error

  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Configure diagnostic tools
        run: cmake --preset release -DBUILD_INTROSPECTION=ON
      - name: Build
        run: cmake --build --preset release --parallel 2
      - name: Build non-default fixed-block pilot
        run: cmake --build --preset release --target uchardet-fixed-block uchardet-fixed-block-test uchardet-fixed-block-timing --parallel 2
      - name: Fixed-block contract comparisons
        run: timeout 10s build/release/benchmark/uchardet-fixed-block-test
      - name: Build non-default allocation observers
        run: cmake --build --preset release --target uchardet-fixed-block-allocations uchardet-fixed-block-allocations-plain --parallel 2
      - name: Tool tests
        env:
          UCHARDET_FIXED_BLOCK: build/release/benchmark/uchardet-fixed-block
          UCHARDET_FIXED_BLOCK_TIMING: build/release/benchmark/uchardet-fixed-block-timing
          UCHARDET_FIXED_BLOCK_ALLOCATIONS: build/release/benchmark/uchardet-fixed-block-allocations
          UCHARDET_FIXED_BLOCK_ALLOCATIONS_PLAIN: build/release/benchmark/uchardet-fixed-block-allocations-plain
          UCHARDET_TRACE: build/release/benchmark/uchardet-trace
          UCHARDET_FILTER_PROFILE: build/release/benchmark/uchardet-filter-profile
        run: uv run --no-project --python 3.11 python -m unittest discover -s benchmark -p 'test_*.py'
      - name: Corpus and model tool tests (offline)
        env:
          UCHARDET_FILTER_PROFILE: build/release/benchmark/uchardet-filter-profile
          UCHARDET_STATIC_LIBRARY: build/release/src/libuchardet.a
          UCHARDET_ENGINE_EXPERIMENT: '1'
        run: |
          uv run --no-project --python 3.11 python -m unittest discover -s corpus -p 'test_*.py'
          uv run --no-project --python 3.11 python -m unittest discover -s corpus/sources -p 'test_*.py'
          uv run --no-project --python 3.11 python -m unittest discover -s models/experimental -p 'test_*.py'
      - name: Candidate and lifecycle observations
        run: uv run --no-project --python 3.11 python benchmark/conformance.py build/release/benchmark/uchardet-conformance > conformance.json
      - uses: actions/upload-artifact@v7
        with:
          name: native-conformance
          path: conformance.json

  corpus-portability:
    name: Corpus tools / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Corpus tests
        run: uv run --no-project --python 3.11 python -m unittest discover -s corpus -p 'test_*.py'
      - name: Acquisition tests
        run: uv run --no-project --python 3.11 python -m unittest discover -s corpus/sources -p 'test_*.py'
      - name: Model tests
        run: uv run --no-project --python 3.11 python -m unittest discover -s models/experimental -p 'test_*.py'
